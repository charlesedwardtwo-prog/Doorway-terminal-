name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/news.py
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect headlines
        run: python3 scripts/news.py
      - name: Save news.json
        run: |
          git config user.name "doorway-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update news"
          git pull --rebase origin main
          git push
