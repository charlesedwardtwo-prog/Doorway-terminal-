name: Build Doorway app

on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the install file
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name it doorway.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk doorway.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Doorway app 1.0.${{ github.run_number }}
          body: Install doorway.apk on the tablet. Newer versions install over older ones.
          files: doorway.apk
          make_latest: "true"
